# ==========================================================================
# CRE PROJECT SETTINGS FILE (layout as generated by `cre init`, CLI v1.39.0)
# ==========================================================================
# Targets:
#   fork-settings          Anvil mainnet fork at 127.0.0.1:8545 (the demo; spec §8).
#                          The mainnet MockKeystoneForwarder 0xa3d1ad4ac559a6575a114998affb2fb2ec97a7d9
#                          is built into the CLI for ethereum-mainnet and exists in forked state.
#   sepolia-settings       Sepolia testnet. Forwarder 0x15fC6ae953E024d975e77382eEeC56A9101f9F88
#                          (built into the CLI for ethereum-testnet-sepolia). RPC from SEPOLIA_RPC.
#   sepolia-fork-settings  Anvil fork of Sepolia at 127.0.0.1:8546 (dry runs).
#   production-settings    Real Ethereum mainnet RPC (reads only; not used for the demo).
#
# RPC URLs support ${VAR_NAME} syntax, resolved from .env or the shell.

# ==========================================================================
fork-settings:
  rpcs:
    - chain-name: ethereum-mainnet
      url: http://127.0.0.1:8545

# ==========================================================================
sepolia-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: ${SEPOLIA_RPC}

# ==========================================================================
sepolia-fork-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: http://127.0.0.1:8546

# ==========================================================================
production-settings:
  rpcs:
    - chain-name: ethereum-mainnet
      url: https://rpc.mevblocker.io
